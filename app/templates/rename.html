{% extends "base.html" %}
{% block title %}Rename tape - Storyboard Studio{% endblock %}
{% block content %}
<p><a href="{{ url_for('main.show_storyboard', storyboard_id=board.id) }}">&#9664; Back to tape</a></p>
<section class="menu">
  <h2 class="menu-title">Rename tape</h2>
  <div class="menu-body">
    {% if error %}<div class="error" role="alert"><p class="warn-head">!! TRACKING ERROR !!</p><p>{{ error }}</p></div>{% endif %}
    <form method="post" action="{{ url_for('main.rename_storyboard', storyboard_id=board.id) }}">
      <div class="field stack">
        <span class="mark" aria-hidden="true">&#9654;</span>
        <label for="song_title">Song title</label>
        <input class="control" type="text" id="song_title" name="song_title" value="{{ title }}" maxlength="{{ max_title }}" required>
      </div>
      <button class="btn" type="submit">Save</button>
    </form>
  </div>
</section>
{% endblock %}
